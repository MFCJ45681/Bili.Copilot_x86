# 应用内置 libmpv，部分配置（比如 OSD）将无法生效
# 参考：https://mpv.io/manual/master/#configuration-files

# ===== x86 32 位渲染 / 解码适配 =====
# vo=gpu 相比 gpu-next 在 x86 与核显上兼容性更好、开销更低；
# gpu-next 的 d3d11va 零拷贝路径在部分驱动上会失败并反复重试。
vo = gpu
gpu-api = d3d11
gpu-context = auto

# hwdec=auto 仅在白名单解码器中挑选，失败时自动回退软解；
# 不使用 auto-unsafe（会启用未经稳定性验证的解码器）。
# 内置 libmpv 已内置 hevc / av1(dav1d) / libx265 / libaom 解码器，
# 无需更换二进制；硬解可用时走 d3d11va，不可用时回退软解。
hwdec = auto

ao = wasapi

# ===== 播放稳定性与性能 =====
# 预读与缓冲：32 位下按网络波动取值，避免起播慢与反复缓冲。
demuxer-readahead-secs = 30
cache-secs = 30

# 关键帧精确 seek，改善 HEVC/AV1 长 GOP 下的拖动与回退。
hr-seek = yes
hr-seek-framedrop = yes

# 保持播放状态，配合 idle 便于后台预加载。
keep-open = yes
idle = yes

# 关闭高开销后处理：插值与去色带在核显/32 位上会加剧掉帧。
interpolation = no
deband = no

# 缩放算法：双三次在核显上偏重，体积缩放更快且观感可接受。
scale = bilinear

# OSD 进度条由应用 UI 自行绘制，关闭 mpv 内建 OSD。
osc = no
osd-level = 0

# 应用内置 libmpv，部分配置（比如 OSD）将无法生效
# 参考：https://mpv.io/manual/master/#configuration-files

vo = gpu-next
hwdec = auto-copy
ao = wasapi
audio-channels = auto

# ===== 性能 / 音视频同步优化 =====
# 以显示器刷新率为基准重采样音频时钟，消除音视频不同步与掉帧
video-sync = display-resample
# 帧率不匹配时插值，减少卡顿 / 抖动
interpolation = yes
# 网络流缓冲时长，避免反复缓冲造成的卡顿
cache-secs = 30
# 解封装预读秒数（与 demuxer 缓存互补）
demuxer-readahead-secs = 30
# 关闭去色带后处理，降低 GPU 开销
deband = no